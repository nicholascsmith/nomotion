# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: excellent-os
description: GNOME workstation on secureblue.
base-image: ghcr.io/secureblue/silverblue-main-hardened
image-version: latest

modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # desktop (base image already has GNOME, Nautilus and GNOME Disks)
        - jetbrains-mono-fonts
        - mpv
        - rsms-inter-fonts
        - transmission-gtk
        # login shell stays in the image so it works without Homebrew; CLI tools come from the Brewfile
        - zsh
        - zsh-syntax-highlighting

  # COPR repo file, because secureblue's os-release makes `dnf copr` look for secureblue chroots
  - type: dnf
    repos:
      cleanup: true
      files:
        - scottames-ghostty.repo
    install:
      install-weak-deps: false
      packages:
        - ghostty

  - type: files
    files:
      - source: system
        destination: /

  - type: justfiles

  - type: signing

  - type: script
    scripts:
      - image-key.sh
